<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 60" width="130" height="60">
  <!-- Type-only wordmark. The period is the mark. Robust variant: the period is a
       tspan in the same text run, so it stays kerned to the "l" whatever font
       resolves; the stack ends in sans-serif so it can never fall to the default
       serif. Still substitutes the TYPEFACE where SF Pro / Inter are absent —
       only an outlined vector fixes that. -->
  <text x="0" y="45"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="48" font-weight="600" letter-spacing="-1.8" fill="#FFFFFF">rial<tspan fill="#EC1B8A">.</tspan></text>
</svg>
